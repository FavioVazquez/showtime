  return k<f.length?f[k]:1;
}

function drawBeam(ctx,cam,lv,t){
  // volumetric cone from above the valance into the pool, clipped to the stage opening
  const ax=cam.ox+50*cam.s, ay=cam.oy+13.5*cam.s;
  bg.setTransform(1,0,0,1,0,0); bg.globalCompositeOperation='source-over'; bg.clearRect(0,0,W,H);
  bg.save(); bg.setTransform(cam.s,0,0,cam.s,cam.ox,cam.oy); bg.clip(WIN); bg.setTransform(1,0,0,1,0,0);
  const cg=bg.createConicGradient(-Math.PI/2,ax,ay), d=.043;
  [[.5-d*1.45,0],[.5-d,.16],[.5-d*.6,.42],[.5-d*.22,.8],[.5,1],[.5+d*.22,.8],[.5+d*.6,.42],[.5+d,.16],[.5+d*1.45,0]]
    .forEach(([o,a])=>cg.addColorStop(o,`rgba(255,222,150,${a})`));
  bg.fillStyle=cg; bg.fillRect(0,0,W,H);
  bg.restore();
  // fade along the length and stop at the floor
  bg.globalCompositeOperation='destination-in';
  const lg=bg.createLinearGradient(0,cam.oy+26*cam.s,0,cam.oy+81*cam.s);
  lg.addColorStop(0,'rgba(0,0,0,.95)'); lg.addColorStop(.55,'rgba(0,0,0,.6)'); lg.addColorStop(.88,'rgba(0,0,0,.75)'); lg.addColorStop(1,'rgba(0,0,0,0)');
  bg.fillStyle=lg; bg.fillRect(0,0,W,H);
  // haze: drifting fractal noise modulates the beam
  bg.globalCompositeOperation='destination-in';
  const hz=cam.s*70, hx=cam.ox+(15-t*1.6)*cam.s, hy=cam.oy+18*cam.s;
  bg.globalAlpha=1; bg.drawImage(HAZE,hx,hy,hz*1.6,hz*.9);
  bg.globalCompositeOperation='source-over'; bg.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=1.0*lv; ctx.drawImage(beamC,0,0);
  ctx.globalAlpha=.45*lv;  // a second, unmodulated soft core so the cone never breaks up
  const cg2=ctx.createConicGradient(-Math.PI/2,ax,ay);
  [[.5-d,0],[.5-d*.35,.28],[.5,.5],[.5+d*.35,.28],[.5+d,0]].forEach(([o,a])=>cg2.addColorStop(o,`rgba(255,214,140,${a})`));
  ctx.save(); ctx.setTransform(cam.s,0,0,cam.s,cam.ox,cam.oy); ctx.clip(WIN);
  ctx.fillStyle=cg2; ctx.setTransform(1,0,0,1,0,0); ctx.fillRect(0,ay,W,Math.max(0,cam.oy+79*cam.s-ay)); ctx.restore();
  // lamp glare at the top and bloom on the pool
  const px=ax, py=cam.oy+76.5*cam.s;
  let rg=ctx.createRadialGradient(px,py,0,px,py,26*cam.s);
  rg.addColorStop(0,'rgba(255,214,140,.55)'); rg.addColorStop(.35,'rgba(233,185,73,.18)'); rg.addColorStop(1,'rgba(233,185,73,0)');
  ctx.globalAlpha=lv; ctx.setTransform(1,0,0,.42,0,py*(1-.42)); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H*3); ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

function inBeam(x,y){ // 0..1 how deep a mark-space point sits in the cone
  if(y<27||y>79) return 0; const half=(y-13.5)*.27; const q=Math.abs(x-50)/half; return q>=1.25?0:Math.pow(1-Math.min(1,q/1.25),1.4);
}

function drawDust(ctx,cam,t,lv,amb){
  ctx.globalCompositeOperation='lighter';
  for(const m of DUST){
    const x=m.x+Math.sin(t*m.sp+m.ph)*.9+ST.noise(t*.35+m.ph,3)*.8+t*.25*(m.z-1);
    const y=m.y-t*.35*m.z+Math.sin(t*.5+m.ph2)*.5;
    const b=lv*inBeam(x,y)*1.0+amb*.22;
    if(b<.01) continue;
    const sx=cam.ox+x*cam.s, sy=cam.oy+y*cam.s;
    if(sx<-20||sx>W+20||sy<-20||sy>H+20) continue;
    let r=(m.big?.55:.11)*m.z*cam.s; r=Math.max(.7,Math.min(m.big?26:4,r));
    const a=Math.min(1,b*(m.big?.13:.9))*(.55+.45*Math.sin(t*3+m.ph*3));
    const rg=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    rg.addColorStop(0,`rgba(255,240,205,${a})`); rg.addColorStop(1,'rgba(255,240,205,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(sx,sy,r,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

function drawKeyLight(ctx,t,lv){
  // the wide stage light the wordmark lands in (after the pull-back)
  if(lv<=0) return;
  const ax=W*.5, ay=-H*(CFG.sq?.55:.75);
  const cg=ctx.createConicGradient(-Math.PI/2,ax,ay), d=CFG.sq?.085:.07;
  [[.5-d*1.3,0],[.5-d,.05],[.5-d*.5,.13],[.5,.17],[.5+d*.5,.13],[.5+d,.05],[.5+d*1.3,0]].forEach(([o,a])=>cg.addColorStop(o,`rgba(255,220,150,${a})`));
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=lv*.6; ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);
  bg.setTransform(1,0,0,1,0,0); bg.clearRect(0,0,W,H); bg.globalCompositeOperation='source-over';
  bg.fillStyle=cg; bg.fillRect(0,0,W,H);
  bg.globalCompositeOperation='destination-in'; bg.drawImage(HAZE2,-W*.1-t*22,-H*.2,W*1.5,H*2.4);
  bg.globalCompositeOperation='source-over';
  ctx.globalAlpha=lv*.45; ctx.drawImage(beamC,0,0);
  // floor glow under the lockup
  const [x0,y0,x1,y1]=CFG.wb; const cx=W/2, cy=CFG.sq?y1+60:Math.max(y1,CFG.fy+CFG.sf*50)+40;
  const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,W*(CFG.sq?.45:.3));
  rg.addColorStop(0,'rgba(233,185,73,.13)'); rg.addColorStop(1,'rgba(233,185,73,0)');
  ctx.globalAlpha=lv; ctx.setTransform(1,0,0,.2,0,cy*(1-.22)); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H*6); ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  for(const m of KEYDUST){
    const x=m.x*W+Math.sin(t*.4+m.ph)*14+t*6*(m.z-1), y=m.y*H-t*9*m.z+Math.sin(t*.6+m.ph2)*8;
    const q=Math.abs(x-ax)/Math.max(1,(y-ay)*Math.tan(d*6.2832)); if(q>1.1) continue;
    const a=lv*.55*(1-q/1.1)*(.5+.5*Math.sin(t*2.6+m.ph*4)), r=1.1*m.z;
    ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,238,200,${a})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

const LT=[...document.querySelectorAll('.lt')];
ST.onSeek(t=>{
  const cam=camera(t);
  $('cam').setAttribute('transform',`translate(${cam.ox.toFixed(2)} ${cam.oy.toFixed(2)}) scale(${cam.s.toFixed(5)})`);
  // fade up from black, letterbox in / out
  $('black').style.opacity=(.3*(1-E.oq(P(t,0,.8)))).toFixed(3);
  const bin=E.ioc(P(t,.2,1.1)), bout=E.ioc(P(t,4.3,5.0));
  const bh=CFG.bar*bin*(1-bout);
  $('bt').style.height=$('bb').style.height=bh.toFixed(2)+'px';
  // house lights dim, footlights rise: the breath before the show
  const dim=E.ios(P(t,1.1,1.9))*.5;
  const foot=E.ios(P(t,1.0,1.9))*(1-E.oq(P(t,2.9,3.4)));
  ['l','r'].forEach(sd=>{
    const d=$('hdm'+sd); if(d) d.setAttribute('opacity',dim.toFixed(3));
    $('hft'+sd).setAttribute('opacity',foot.toFixed(3));
  });
  // anticipation tug, then the curtains part to the tie-backs
  const tug=Math.sin(P(t,1.85,2.3)*Math.PI)*.028 + Math.sin(P(t,1.85,2.3)*Math.PI*3)*.006;
  const o=E.ioc(P(t,2.25,3.15));
  const sc=Math.max(.02,(1-o)*(1+tug));
  const sway=Math.sin(t*1.7)*.0025*(1-o);
  $('hpl').setAttribute('transform',`translate(14 0) scale(${sc.toFixed(4)} 1) skewX(${(sway*57).toFixed(3)}) translate(-14 0)`);
  $('hpr').setAttribute('transform',`translate(86 0) scale(${sc.toFixed(4)} 1) skewX(${(-sway*57).toFixed(3)}) translate(-86 0)`);
  $('hpl').setAttribute('opacity',o>.985?0:1); $('hpr').setAttribute('opacity',o>.985?0:1);
  // the spotlight
  const lv=lamp(t);
  ['h_pool','h_floorglow','h_rim'].forEach(id=>$(id).setAttribute('opacity',(id==='h_rim'?lv*.95:lv).toFixed(3)));
  // wordmark lands in the light
  LT.forEach((el,i)=>{
    const p=E.oc(P(t,4.64+i*.045,5.24+i*.045));
    const dy=(1-p)*26*H/1080;
    el.setAttribute('transform',`translate(0 ${dy.toFixed(2)})`);
    el.setAttribute('opacity',p.toFixed(3));
  });
  const sw=P(t,5.15,5.95), [x0,y0,x1,y1]=CFG.wb;
  $('wsweep').setAttribute('opacity',(Math.sin(sw*Math.PI)*.75).toFixed(3));
  const gx=L(-W*.2,x1-x0+W*.05,E.ios(sw));
  document.querySelector('#sweep').setAttribute('gradientTransform',`translate(${gx.toFixed(1)} 0)`);
  // canvas light
  g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='source-over'; g.clearRect(0,0,W,H);
  if(lv>0) drawBeam(g,cam,lv,t);
  drawDust(g,cam,t,lv,foot*(1-o)+.15*(1-P(t,3.9,4.6)));
  if(foot>0){ // footlights: warm light rising from the stage lip
    const yb=H-CFG.bar*bin, fl=g.createLinearGradient(0,yb,0,yb-H*.45);
    fl.addColorStop(0,`rgba(255,206,130,${.34*foot})`); fl.addColorStop(.4,`rgba(233,170,80,${.10*foot})`); fl.addColorStop(1,'rgba(233,170,80,0)');
    g.globalCompositeOperation='lighter'; g.fillStyle=fl; g.fillRect(0,0,W,H); g.globalCompositeOperation='source-over';
  }
  drawKeyLight(g,t,E.ios(P(t,4.3,5.1)));
  // grain (12 fps)
  gg.globalCompositeOperation='copy'; gg.drawImage(GRAIN[Math.floor(t*12)%4],0,0);
});

</script>
