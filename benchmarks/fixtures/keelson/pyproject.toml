[project]
name = "keelson"
version = "0.3.0"
description = "Check a .env file against .env.example: missing, extra, duplicate and empty keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
keelson = "keelson.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
