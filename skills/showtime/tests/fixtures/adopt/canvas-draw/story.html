<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>canvas fixture</title>
<style>html, body { margin: 0; background: #0d1117; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Canvas bar chart drawn as draw(t); the data comes from the driver (setData), like a model's render.js does.
const W = 1280, H = 720;
const ctx = document.getElementById('c').getContext('2d');
let DATA = [];
window.setData = (rows) => { DATA = rows; };
const clamp01 = (x) => Math.max(0, Math.min(1, x));
window.draw = function (t) {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e6edf3';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText('Rows: ' + DATA.length, 80, 110);
  const n = DATA.length || 1;
  const bw = (W - 160) / n;
  DATA.forEach((d, i) => {
    const k = clamp01((t - 0.3 - i * 0.15) / 0.6);
    const h = d.v * 4 * k;
    ctx.fillStyle = '#3fb950';
    ctx.fillRect(80 + i * bw + 8, H - 80 - h, bw - 16, h);
  });
};
window.DURATION = 3;
</script>
</body>
</html>
